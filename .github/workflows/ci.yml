name: CI

on:
  push:
    branches:
      - main
      - "milestone/**"
      - "fix/**"
  pull_request:
    branches:
      - main

# Least-privilege permissions. Jobs that need additional permissions
# declare them explicitly.
permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────
  # Secret scanning — runs against full history, not just the diff
  # ────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history)
        # actions/checkout@v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        # gitleaks/gitleaks-action@v3.0.0
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ────────────────────────────────────────────────────────────────
  # Infrastructure validation — no services started
  # ────────────────────────────────────────────────────────────────
  infra-validate:
    name: Validate Docker Compose configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # actions/checkout@v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Validate docker-compose.yml
        run: docker compose -f infrastructure/docker-compose.yml config --quiet

  # ────────────────────────────────────────────────────────────────
  # Frontend — format, lint, typecheck, test, build
  # ────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (format, lint, typecheck, test, build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # actions/checkout@v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Node.js 24
        # actions/setup-node@v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: Enable pnpm 11.12.0 via Corepack
        run: |
          corepack enable pnpm
          corepack prepare pnpm@11.12.0 --activate

      - name: Verify pnpm version is exactly 11.12.0
        run: |
          PNPM_VER=$(pnpm --version)
          echo "pnpm version: $PNPM_VER"
          [ "$PNPM_VER" = "11.12.0" ] || (echo "ERROR: Expected pnpm 11.12.0, got $PNPM_VER"; exit 1)

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        # actions/cache@v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies (frozen, from workspace root)
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run --filter web format:check

      - name: Lint
        run: pnpm run --filter web lint

      - name: Type check
        run: pnpm run --filter web typecheck

      - name: Test
        run: pnpm run --filter web test

      - name: Production build
        run: pnpm run --filter web build

  # ────────────────────────────────────────────────────────────────
  # Backend — format, lint, typecheck, test
  # ────────────────────────────────────────────────────────────────
  backend:
    name: Backend (format, lint, typecheck, test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: expertseat_test
          POSTGRES_USER: expertseat
          POSTGRES_PASSWORD: expertseat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # APP_ENV=test is set so that: the application starts correctly,
    # and tests that check default values use monkeypatch to clear it.
    env:
      DATABASE_URL: postgresql://expertseat:expertseat_test@localhost:5432/expertseat_test
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test

    steps:
      - name: Checkout
        # actions/checkout@v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Python 3.12
        # actions/setup-python@v6.3.0
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install uv
        # astral-sh/setup-uv@v8.3.2
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.11.7"

      - name: Cache uv store
        # actions/cache@v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('services/api/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        working-directory: services/api
        run: uv sync --extra dev

      - name: Format check
        working-directory: services/api
        run: uv run ruff format --check .

      - name: Lint
        working-directory: services/api
        run: uv run ruff check .

      - name: Type check
        working-directory: services/api
        run: uv run pyright

      - name: Test
        working-directory: services/api
        run: uv run pytest -v

      - name: Validate API imports and startup
        working-directory: services/api
        run: |
          uv run python -c "from app.main import app; print('API startup OK')"

  # ────────────────────────────────────────────────────────────────
  # Database migrations — full upgrade → downgrade → re-upgrade cycle
  # ────────────────────────────────────────────────────────────────
  migrations:
    name: Database migrations (upgrade → downgrade → upgrade)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: expertseat_test
          POSTGRES_USER: expertseat
          POSTGRES_PASSWORD: expertseat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://expertseat:expertseat_test@localhost:5432/expertseat_test
      APP_ENV: test

    steps:
      - name: Checkout
        # actions/checkout@v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Python 3.12
        # actions/setup-python@v6.3.0
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install uv
        # astral-sh/setup-uv@v8.3.2
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.11.7"

      - name: Install dependencies
        working-directory: services/api
        run: uv sync --extra dev

      - name: Alembic upgrade to head
        working-directory: services/api
        run: uv run alembic upgrade head

      - name: Alembic downgrade to base
        working-directory: services/api
        run: uv run alembic downgrade base

      - name: Alembic re-upgrade to head
        working-directory: services/api
        run: uv run alembic upgrade head

  # ────────────────────────────────────────────────────────────────
  # Dependency vulnerability audit — pip-audit + pnpm audit
  # Scans for known CVEs in Python and npm dependencies.
  # Note: Gitleaks (secret-scan job) covers committed secrets;
  # this job covers known CVEs — these are separate concerns.
  # ────────────────────────────────────────────────────────────────
  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # actions/checkout@v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Python 3.12
        # actions/setup-python@v6.3.0
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install uv
        # astral-sh/setup-uv@v8.3.2
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.11.7"

      - name: Install Python dependencies (including pip-audit)
        working-directory: services/api
        run: uv sync --extra dev

      - name: Python dependency audit
        working-directory: services/api
        run: uv run pip-audit

      - name: Setup Node.js 24
        # actions/setup-node@v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: Enable pnpm 11.12.0 via Corepack
        run: |
          corepack enable pnpm
          corepack prepare pnpm@11.12.0 --activate

      - name: Verify pnpm version is exactly 11.12.0
        run: |
          PNPM_VER=$(pnpm --version)
          echo "pnpm version: $PNPM_VER"
          [ "$PNPM_VER" = "11.12.0" ] || (echo "ERROR: Expected pnpm 11.12.0, got $PNPM_VER"; exit 1)

      - name: Install npm dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: npm dependency audit (high and critical only)
        run: pnpm audit --audit-level high

  # ────────────────────────────────────────────────────────────────
  # Runtime smoke test — start Uvicorn via Docker Compose (not
  # services:), verify HTTP responses, and test graceful degradation
  # when a dependency is stopped and then restarted.
  #
  # Uses docker compose (not GitHub services:) so that individual
  # containers can be stopped and restarted during degradation tests.
  # Delegates to scripts/check_infrastructure.sh (migrations) and
  # scripts/check_runtime.sh (HTTP + degradation tests).
  # ────────────────────────────────────────────────────────────────
  runtime:
    name: API runtime smoke test
    runs-on: ubuntu-latest

    # DATABASE_URL and REDIS_URL match infrastructure/docker-compose.yml
    # credentials exactly so no .env file is needed.
    env:
      DATABASE_URL: postgresql://expertseat:expertseat_dev@localhost:5432/expertseat
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test

    steps:
      - name: Checkout
        # actions/checkout@v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Python 3.12
        # actions/setup-python@v6.3.0
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install uv
        # astral-sh/setup-uv@v8.3.2
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.11.7"

      - name: Install Python dependencies
        working-directory: services/api
        run: uv sync --locked --extra dev

      - name: Start infrastructure and run migration cycle
        run: CLEANUP_INFRA=false scripts/check_infrastructure.sh

      - name: Run runtime checks (liveness, readiness, degradation, recovery)
        run: scripts/check_runtime.sh
